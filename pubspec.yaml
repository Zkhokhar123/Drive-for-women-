name: drive_for_women
description: "Drive for Women - Safe Rides, by Women for Women"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0
  pinput: ^5.0.0
  fl_chart: ^0.70.2
  url_launcher: ^6.3.1
  font_awesome_flutter: ^10.7.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0
  image_picker: ^1.1.2

  # ── Firebase ────────────────────────────────────────────────
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  http: ^1.6.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_girl.png"
  adaptive_icon_background: "#12121E"
  adaptive_icon_foreground: "assets/images/logo_girl.png"
  remove_alpha_ios: true
  min_sdk_android: 21
